{% extends "base.html" %}
{% block titulo %}Recibo de abono · No. {{ venta.numero_orden }}{% endblock %}

{% block contenido %}
  <div class="acciones-formulario acciones-volver no-imprimir">
    <a class="boton boton--secundario boton--pequeno" href="{{ url_for('ver_pendientes') }}">← Volver a pendientes</a>
    <button class="boton boton--secundario boton--pequeno" type="button" onclick="window.print()">Imprimir</button>
    <button class="boton boton--primario boton--pequeno" type="button"
            data-compartir
            data-pdf="{{ url_for('ver_recibo_imagen', id_abono=abono.id_abono) }}"
            data-nombre="{{ nombre_archivo }}"
            data-texto="{{ texto_compartir }}"
            data-whatsapp="{{ enlace_whatsapp }}">Compartir recibo</button>
  </div>

  {% include "olb_byte/_recibo.html" %}
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('estaticos', path='js/factura.js') }}" defer></script>
{% endblock %}
