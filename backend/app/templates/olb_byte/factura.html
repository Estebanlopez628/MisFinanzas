{% extends "base.html" %}
{% block titulo %}Factura No. {{ venta.numero_orden }}{% endblock %}

{% block estilos %}
  <link rel="stylesheet" href="{{ url_for('estaticos', path='css/factura-olb.css') }}" />
{% endblock %}

{% block contenido %}
  <div class="barra-herramientas-factura no-imprimir">
    <div class="acciones-formulario">
      <a class="boton boton--primario boton--pequeno" href="{{ url_for('ver_olb_byte') }}">← Volver a Ventas</a>
      <button class="boton boton--primario boton--pequeno" type="button"
              data-descargar-imagen
              data-fragmento="{{ url_for('ver_factura_hoja', id_venta=venta.id_venta) }}"
              data-nombre="{{ nombre_archivo }}">Descargar imagen</button>
      <button class="boton boton--secundario boton--pequeno" type="button"
              data-compartir
              data-fragmento="{{ url_for('ver_factura_hoja', id_venta=venta.id_venta) }}"
              data-nombre="{{ nombre_archivo }}"
              data-texto="{{ texto_compartir }}"
              data-whatsapp="{{ enlace_whatsapp }}"
              {% if not venta.cliente_telefono %}data-sin-celular{% endif %}>Compartir por WhatsApp</button>
      <button class="boton boton--secundario boton--pequeno" type="button" onclick="window.print()">
        Imprimir
      </button>
    </div>
  </div>

  <div class="hoja-contenedor">
    {% include "olb_byte/_hoja_factura.html" %}
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('estaticos', path='js/vendor/html-to-image.js') }}" defer></script>
  <script src="{{ url_for('estaticos', path='js/factura.js') }}" defer></script>
{% endblock %}
